[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-fraud-investigation"
version = "0.1.0"
description = "TigerGraph-backed agentic fraud investigation benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "duckdb>=1.2",
  "httpx>=0.27",
  "langgraph>=0.2",
  "mcp>=1.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "polars>=1.20",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "scikit-learn>=1.6",
  "streamlit>=1.41",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
tigergraph = ["pyTigerGraph-mcp>=0.4"]

[project.scripts]
fraud-agent = "fraud_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fraud_agent"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
